<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Money Adsgram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background: #0b1026; 
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: white;
        }
        canvas { display: block; margin: 0 auto; background: linear-gradient(to bottom, #0b1026, #1d2b64); }
        
        .ui-overlay {
            position: absolute; top: 10px; width: 100%;
            text-align: center; pointer-events: none; z-index: 10;
        }
        .info-bar {
            background: rgba(0, 0, 0, 0.6); padding: 10px 20px;
            border-radius: 30px; border: 1px solid #00d2ff;
            display: inline-flex; gap: 15px; align-items: center;
        }
        .online-count { color: #ffeb3b; font-weight: bold; font-size: 12px; }

        .menu-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 16, 38, 0.9);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; z-index: 20; text-align: center;
            backdrop-filter: blur(8px);
        }
        .btn-start {
            padding: 15px 45px; font-size: 18px; font-weight: bold;
            background: #00d2ff; border: none; border-radius: 50px;
            color: #0b1026; cursor: pointer; transition: 0.3s;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
            margin-top: 20px; pointer-events: auto;
        }
        .btn-start:disabled { background: #555; box-shadow: none; cursor: not-allowed; }
        .hidden { display: none !important; }
        .stat-label { font-size: 10px; color: #aaa; text-transform: uppercase; }
        #adStatus { font-size: 12px; color: #ffeb3b; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <div class="info-bar">
            <div><span class="stat-label">Balans:</span> <br><span id="highScore">0.00</span></div>
            <div class="online-count">● <span id="onlineCount">1</span></div>
            <div><span class="stat-label">Yutuq:</span> <br><span id="currentScore" style="color:#34e89e">0.00</span></div>
        </div>
    </div>

    <div id="startScreen" class="menu-screen">
        <h1 style="font-size: 32px; margin-bottom: 5px;">🚀 ROCKET MONEY</h1>
        <p id="userNameDisplay" style="color: #00d2ff;">Yuklanmoqda...</p>
        <p style="font-size: 12px; color: #aaa;">O'yinni boshlash uchun reklamani ko'ring</p>
        <button id="mainStartBtn" class="btn-start" onclick="showAdAndStart()">BOSHLASH (AD)</button>
        <div id="adStatus"></div>
    </div>

    <div id="gameOverScreen" class="menu-screen hidden">
        <h2 style="color: #ff0055; font-size: 30px;">TAMOM!</h2>
        <p id="finalResult" style="font-size: 16px; margin: 15px 0;"></p>
        <button id="retryBtn" class="btn-start" style="background: #34e89e; box-shadow: 0 0 20px #34e89e;" onclick="showAdAndStart()">QAYTA O'YNASH (AD)</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, onDisconnect, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Telegram WebApp sozlamalari
        const tg = window.Telegram.WebApp;
        tg.expand();
        const user = tg.initDataUnsafe?.user;
        const userId = user?.id || "guest_" + Math.floor(Math.random() * 1000);
        const userName = user?.first_name || "O'yinchi";
        document.getElementById("userNameDisplay").innerText = "Salom, " + userName + "!";

        // Adsgram Sozlamalari (BlockID ni o'zgartiring)
        const AdController = window.Adsgram.init({ blockId: "int-20669" }); 

        // Firebase Sozlamalari
        const firebaseConfig = {
            apiKey: "AIzaSyBt_YoPMKJlEL7RAGwWNx6uPJpoOHaQ2iY",
            authDomain: "game-49172.firebaseapp.com",
            databaseURL: "https://game-49172-default-rtdb.firebaseio.com",
            projectId: "game-49172",
            storageBucket: "game-49172.firebasestorage.app",
            messagingSenderId: "695585468530",
            appId: "1:695585468530:web:e0155f596c4778d1d412eb"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const userBalanceRef = ref(db, `users/${userId}/balance`);
        const onlineRef = ref(db, 'onlinePlayers');

        // Onlayn hisoblagich
        onValue(ref(db, '.info/connected'), (snap) => {
            if (snap.val() === true) {
                set(onlineRef, increment(1));
                onDisconnect(onlineRef).set(increment(-1));
            }
        });
        onValue(onlineRef, (snap) => { document.getElementById("onlineCount").innerText = snap.val() || 1; });

        // O'yin o'zgaruvchilari
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth > 450 ? 400 : window.innerWidth;
        canvas.height = window.innerHeight;

        let birdY, velocity, pipes, currentSessionScore, totalBalance = 0;
        let gameActive = false;
        const gravity = 0.16, jump = -4.6, pipeSpeed = 1.6;

        onValue(userBalanceRef, (snapshot) => {
            totalBalance = snapshot.val() ? parseFloat(snapshot.val()) : 0;
            document.getElementById("highScore").innerText = totalBalance.toFixed(2);
        });

        // Reklama va O'yinni boshlash funksiyasi
        window.showAdAndStart = async () => {
            const statusDiv = document.getElementById("adStatus");
            const btns = [document.getElementById("mainStartBtn"), document.getElementById("retryBtn")];
            
            btns.forEach(b => b.disabled = true);
            statusDiv.innerText = "Reklama yuklanmoqda...";

            try {
                const result = await AdController.show();
                // result: { completed: true, done: true, ... }
                
                statusDiv.innerText = "Rahmat! O'yin boshlanmoqda...";
                setTimeout(() => {
                    document.getElementById("startScreen").classList.add("hidden");
                    document.getElementById("gameOverScreen").classList.add("hidden");
                    runGameInstance();
                }, 500);

            } catch (error) {
                // Reklama ko'rilmasa yoki xato bo'lsa
                statusDiv.innerText = "Xato: O'ynash uchun reklamani to'liq ko'rish shart!";
                console.error("Adsgram error:", error);
            } finally {
                btns.forEach(b => b.disabled = false);
            }
        };

        function runGameInstance() {
            birdY = canvas.height / 2;
            velocity = 0;
            pipes = [];
            currentSessionScore = 0;
            document.getElementById("currentScore").innerText = "0.00";
            gameActive = true;
            requestAnimationFrame(gameLoop);
        }

        function createPipe() {
            let gap = 165;
            let topHeight = Math.floor(Math.random() * (canvas.height - gap - 200)) + 100;
            pipes.push({ x: canvas.width, top: topHeight, bottom: topHeight + gap, passed: false });
        }

        function gameLoop() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            velocity += gravity; birdY += velocity;

            ctx.font = "45px Arial";
            ctx.save();
            ctx.translate(60, birdY);
            ctx.rotate(Math.min(Math.PI / 6, Math.max(-Math.PI / 6, velocity * 0.08)));
            ctx.fillText("🚀", -20, 15);
            ctx.restore();

            if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 220) createPipe();

            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= pipeSpeed;
                ctx.fillStyle = "#ff0055";
                ctx.fillRect(pipes[i].x, 0, 60, pipes[i].top);
                ctx.fillRect(pipes[i].x, pipes[i].bottom, 60, canvas.height);

                if (60 + 15 > pipes[i].x && 60 - 15 < pipes[i].x + 60) {
                    if (birdY - 15 < pipes[i].top || birdY + 10 > pipes[i].bottom) endGame();
                }

                if (!pipes[i].passed && pipes[i].x < 60) {
                    currentSessionScore += 0.2;
                    pipes[i].passed = true;
                    document.getElementById("currentScore").innerText = currentSessionScore.toFixed(2);
                    tg.HapticFeedback.impactOccurred('light');
                }
                if (pipes[i].x < -60) pipes.splice(i, 1);
            }
            if (birdY > canvas.height || birdY < 0) endGame();
            requestAnimationFrame(gameLoop);
        }

        async function endGame() {
            gameActive = false;
            const finalScore = parseFloat(currentSessionScore.toFixed(2));
            const newBalance = parseFloat((totalBalance + finalScore).toFixed(2));
            await set(userBalanceRef, newBalance);

            document.getElementById("finalResult").innerHTML = 
                `Foyda: <b style="color:#34e89e">+${finalScore.toFixed(2)} so'm</b><br>` +
                `Jami balans: ${newBalance.toFixed(2)} so'm`;
            
            document.getElementById("gameOverScreen").classList.remove("hidden");
            tg.HapticFeedback.notificationOccurred('error');
        }

        const handleInput = (e) => { if (gameActive) { velocity = jump; e.preventDefault(); } };
        window.addEventListener("mousedown", handleInput);
        window.addEventListener("touchstart", handleInput, { passive: false });
        window.addEventListener("keydown", (e) => { if (e.code === "Space") handleInput(e); });
    </script>
</body>
</html>
